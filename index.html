<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AMC Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="frontend/css/style.css">
</head>

<body>
    <!-- Background Video -->
    <video autoplay muted loop id="bg-video">
        <source src="frontend/assets/bck.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <!-- Overlay for better text readability -->
    <div class="video-overlay"></div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="card glass-card" style="width: 100%; max-width: 400px;">
            <h1 style="text-align: center; color: var(--primary-color); margin-bottom: 2rem;">AMC Attendance</h1>
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Login</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Login</button>
            </form>

            <div id="error-msg"
                style="color: #ff4444; margin-top: 1rem; text-align: center; display: none; font-weight: 500;"></div>

            <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
                Don't have an account? <a href="#" onclick="alert('Please ask admin to register you'); return false;"
                    style="color: var(--white); text-decoration: underline;">Contact Admin</a>
            </p>
        </div>
    </div>

    <script src="frontend/js/app.js"></script>
</body>

</html>
